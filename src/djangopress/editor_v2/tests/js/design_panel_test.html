<!doctype html>
<meta charset="utf-8">
<title>running</title>
<div class="editor-v2-content" id="host"></div>
<div id="panel"></div>
<pre id="out"></pre>
<script type="module">
import { events } from '../../static/editor_v2/js/lib/events.js';
import { renderDesignPanel, setTokens, unmountDesignPanel } from '../../static/editor_v2/js/modules/design-panel.js';

const fails = [];
let passed = 0;
const eq = (name, got, want) => {
    if (JSON.stringify(got) === JSON.stringify(want)) passed++;
    else fails.push(`${name}: got ${JSON.stringify(got)}, want ${JSON.stringify(want)}`);
};
const realClasses = el => Array.from(el.classList).filter(c => !c.startsWith('ev2-'));
const ok = (name, cond, detail = '') => { if (cond) passed++; else fails.push(`${name} ${detail}`); };

try {
    setTokens({
        colors: [{ name: 'Primary', value: '#C42014' }, { name: 'Gold', value: '#E3A11C' }, { name: 'Text', value: '#14171B' }, { name: 'White', value: '#FFFFFF' }],
        fonts: [{ role: 'Headings', family: 'Fraunces' }, { role: 'Body', family: 'Inter Tight' }],
        spacing: { S: 40, M: 64, L: 104, XL: 152 },
        buttonSizes: { S: [10, 18, 13], M: [14, 28, 15], L: [18, 36, 17] },
    });
    const host = document.getElementById('host');
    host.innerHTML = await (await fetch('../fixtures/elements/panel.html')).text();
    const panel = document.getElementById('panel');
    const emitted = [];
    events.on('change:classes', c => emitted.push(c));
    const groups = () => Array.from(panel.querySelectorAll('.ev2-dp-group > summary')).map(s => s.firstChild.textContent.trim());
    const click = sel => { const b = panel.querySelector(sel); if (!b) throw new Error('missing ' + sel); b.click(); };

    // button: its groups, size L, hover colour, runtime class kept
    const btn = document.getElementById('b');
    renderDesignPanel(panel, btn);
    eq('button groups', groups(), ['Button', 'Colours', 'Link', 'Spacing', 'Visibility & border', 'Advanced']);
    click('[data-control="buttonSize"] [data-val="L"]');
    const sized = emitted.at(-1)?.value || '';
    ok('size L padding', /(^| )pt-\[18px\]( |$)/.test(sized) && /(^| )pb-\[18px\]( |$)/.test(sized) && / px-9( |$)/.test(' ' + sized + ' '), sized);
    ok('runtime class kept', btn.classList.contains('ev2-selected'));
    click('[data-hover="1"]');
    click('[data-control="hoverFill"] [data-val="#E3A11C"]');
    ok('hover colour', (emitted.at(-1)?.value || '').includes('hover:bg-[#E3A11C]'), emitted.at(-1)?.value);

    // heading: More options count, size change then row reset
    const h = document.getElementById('t');
    const before = h.className;
    renderDesignPanel(panel, h);
    eq('heading more count', panel.querySelector('[data-more="typography"] .ev2-dp-count')?.textContent.trim(), '· 7');
    const size = panel.querySelector('[data-control="fontSize"] input[type=range]');
    size.value = 72; size.dispatchEvent(new Event('input', { bubbles: true })); size.dispatchEvent(new Event('change', { bubbles: true }));
    ok('size written', h.className.includes('text-[72px]'), h.className);
    click('[data-reset="fontSize"]');
    eq('row reset', h.className, before);

    // section: space top/bottom XL
    const s = document.getElementById('hero');
    renderDesignPanel(panel, s);
    click('[data-control="padY"] [data-val="XL"]');
    ok('section XL', s.className.includes('pt-[152px]') && s.className.includes('pb-[152px]') && !/(^| )py-20( |$)/.test(s.className), s.className);
    // Copy style: only the panel's properties; js-track stays
    renderDesignPanel(panel, btn);
    click('[data-act="copy-style"]');
    renderDesignPanel(panel, document.getElementById('b2'));   // the next element clicked
    eq('copy style', realClasses(btn).sort(), ['border', 'border-[#14171B]', 'hover:underline', 'inline-flex', 'js-track', 'px-4', 'py-2', 'rounded-full', 'text-[#14171B]'].sort());

    // Reset element
    const p = document.getElementById('p');
    const original = p.className;
    renderDesignPanel(panel, p);
    click('[data-control="fontWeight"] [data-val="700"]');
    click('[data-control="textAlign"] [data-val="center"]');
    click('[data-act="reset-element"]');
    eq('reset element', p.className, original);
    // leaving the Design tab: the panel must stop acting on the shared container
    const linkA = document.getElementById('b2');
    renderDesignPanel(panel, linkA);
    const hrefBefore = linkA.getAttribute('href');
    unmountDesignPanel();
    panel.innerHTML = '<div class="content-tab"><input data-attr="href" value="/other/"></div>';   // what the Content tab renders
    const input = panel.querySelector('input');
    input.dispatchEvent(new Event('change', { bubbles: true }));
    eq('no write after leaving the tab', linkA.getAttribute('href'), hrefBefore);
    events.emit('changes:applied', { selector: 'section[data-section="hero"] > div:nth-child(1) > a:nth-child(4)' });
    events.emit('viewport:changed', 'mobile');
    ok('content tab not replaced', !!panel.querySelector('.content-tab'));

    // copy style: same type only, layout classes (display, gap) stay
    renderDesignPanel(panel, document.getElementById('t'));
    click('[data-act="copy-style"]');
    const headingBefore = document.getElementById('t').className;
    renderDesignPanel(panel, btn);                      // a button is not a heading
    eq('copy refused across types', document.getElementById('t').className, headingBefore);
    const iconBtn = document.createElement('a');
    iconBtn.id = 'b3'; iconBtn.href = '/x/'; iconBtn.className = 'inline-flex items-center gap-2 px-3 py-1 bg-[#14171B] text-white';
    iconBtn.textContent = 'Icon';
    btn.after(iconBtn);
    renderDesignPanel(panel, iconBtn);
    click('[data-act="copy-style"]');
    renderDesignPanel(panel, document.getElementById('b2'));
    ok('layout kept on copy', iconBtn.classList.contains('inline-flex') && iconBtn.classList.contains('items-center') && iconBtn.classList.contains('gap-2'), iconBtn.className);
    // first use: tokens load (here the endpoint fails and the fallback is used), then the panel appears
    setTokens(null);
    renderDesignPanel(panel, document.getElementById('t'));
    await new Promise(r => setTimeout(r, 800));
    ok('panel appears after tokens load', !!panel.querySelector(':scope > .ev2-dp'), panel.innerHTML.slice(0, 80));
} catch (err) {
    fails.push('crash: ' + err.message);
}
document.getElementById('out').textContent = fails.join('\n') || 'all good';
document.title = fails.length ? `FAIL ${fails.length}` : `PASS ${passed}`;
</script>
