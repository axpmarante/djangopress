<!doctype html>
<meta charset="utf-8">
<title>running</title>
<div class="editor-v2-content" id="host"></div>
<pre id="out"></pre>
<script type="module">
import { elementType } from '../../static/editor_v2/js/lib/element-types.js';

const fails = [];
let passed = 0;
const eq = (name, got, want) => {
    if (JSON.stringify(got) === JSON.stringify(want)) passed++;
    else fails.push(`${name}: got ${JSON.stringify(got)}, want ${JSON.stringify(want)}`);
};
try {
    const host = document.getElementById('host');
    host.innerHTML = await (await fetch('../fixtures/elements/types.html')).text();
    host.querySelectorAll('[data-expect]').forEach((el, i) => {
        eq(`#${i} <${el.tagName.toLowerCase()} ${el.className}>`, elementType(el), el.dataset.expect);
    });
    eq('null element', elementType(null), 'other');
} catch (err) {
    fails.push('crash: ' + err.message);
}
document.getElementById('out').textContent = fails.join('\n') || 'all good';
document.title = fails.length ? `FAIL ${fails.length}` : `PASS ${passed}`;
</script>
